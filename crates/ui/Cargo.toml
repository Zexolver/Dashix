[package]
name = "pocketserver-ui"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "pocketserver-ui"
path = "src/main.rs"

[dependencies]
slint = "1.17"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
log = "0.4"

# Slint's Android integration is its own backend, selected via this feature
# (see src/lib.rs's `android_main`, gated on target_os = "android", and
# https://docs.rs/slint/latest/slint/android/index.html) rather than the
# desktop winit backend the base `slint` dependency above pulls in by
# default. Additive, not a replacement: Cargo unions features across
# dependency edges for the matching target.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", features = ["backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.14"

[build-dependencies]
slint-build = "1.17"

[package.metadata.android]
package = "com.zexolver.pocketserver"
apk_label = "PocketServer"
target_sdk_version = 34
min_sdk_version = 26
# pocketserver-daemon is bundled as runtime-libs/arm64-v8a/libpocketserver_daemon.so
# (a plain ELF executable renamed to look like a shared library -- see
# src/android_priv.rs for why) rather than shipped separately; extractNativeLibs
# has to stay true so it exists as a real file on disk at nativeLibraryDir that
# can be exec'd, instead of only being mmap-able straight out of the APK zip.
runtime_libs = "runtime-libs"

[package.metadata.android.application]
extract_native_libs = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
